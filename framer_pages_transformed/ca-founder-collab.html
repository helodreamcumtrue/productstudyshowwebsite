<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Improving the Reels Experience on Instagram | Lakshay Jain</title>
  <meta name="description" content="Improving the Reels Experience on Instagram presentation deliverable by Lakshay Jain.">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #f1f5f9;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Top Navigation Header */
    .viewer-header {
      height: 64px;
      width: 100%;
      background: rgba(13, 15, 18, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateX(-2px);
    }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .project-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e1306c;
      margin-bottom: 2px;
    }

    .project-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* View Switcher Toggle */
    .view-toggle {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .toggle-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e1306c;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .cta-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.15);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Main Content Viewport */
    .viewer-viewport {
      width: 100%;
      height: calc(100% - 64px);
      position: relative;
      background: #090a0d;
    }

    /* PDF Embed Frame */
    .pdf-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      background: #090a0d;
    }

    .pdf-container.hidden {
      display: none;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #111317;
    }

    /* Slide Deck Presentation Mode */
    .slides-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0b0e;
      overflow: hidden;
    }

    .slides-container.hidden {
      display: none;
    }

    .slide-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: auto;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      background: #000000;
    }

    /* Long-form infographic mode (e.g. for PNB single tall page) */
    .slide-stage.scrollable {
      overflow-y: auto;
      display: block;
      text-align: center;
      padding: 24px 0;
    }

    .slide-stage.scrollable .slide-img {
      max-height: none;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Slide Navigation Controls */
    .slides-controls {
      height: 60px;
      width: 100%;
      background: rgba(13, 15, 18, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }

    .nav-arrow-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .slide-counter {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      min-width: 90px;
      text-align: center;
    }

    /* Floating Download Pill */
    .floating-download-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(37, 99, 235, 0.2);
      padding: 10px 20px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .floating-download-pill:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 768px) {
      .viewer-header {
        padding: 0 14px;
        height: 56px;
      }
      .viewer-viewport {
        height: calc(100% - 56px);
      }
      .header-center {
        display: none;
      }
      .back-btn span {
        display: none;
      }
      .back-btn {
        padding: 8px 12px;
      }
      .toggle-btn span {
        display: none;
      }
      .toggle-btn {
        padding: 6px 10px;
      }
      .cta-btn span {
        display: none;
      }
      .cta-btn {
        padding: 8px 12px;
      }
      .floating-download-pill {
        bottom: 16px;
        right: 16px;
        padding: 8px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="viewer-header">
    <div class="header-left">
      <a href="/" class="back-btn" title="Return to Portfolio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back to Portfolio</span>
      </a>
    </div>

    <div class="header-center">
      <span class="project-badge">Product Teardown</span>
      <h1 class="project-title">Improving the Reels Experience on Instagram</h1>
    </div>

    <div class="header-right">
      <div class="view-toggle">
        <button id="btn-view-pdf" class="toggle-btn active" title="View Full Document PDF">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>PDF View</span>
        </button>
        <button id="btn-view-slides" class="toggle-btn" title="View Slide-by-Slide Presentation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Slides</span>
        </button>
      </div>

      <a href="/Insta product teardown by Lakshay.pdf" target="_blank" rel="noopener noreferrer" class="icon-btn" title="Open PDF in Dedicated Tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>

      <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen Mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>

      <a href="/Insta product teardown by Lakshay.pdf" download class="cta-btn" title="Download Case Study PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewer-viewport">
    <!-- View 1: Embedded Native PDF -->
    <section id="pdf-view-container" class="pdf-container">
      <iframe class="pdf-frame" src="/Insta product teardown by Lakshay.pdf#toolbar=1&navpanes=0&view=FitH" title="Improving the Reels Experience on Instagram PDF Presentation"></iframe>
    </section>

    <!-- View 2: High-Resolution Presentation Slide Deck -->
    <section id="slides-view-container" class="slides-container hidden">
      <div id="slide-stage" class="slide-stage ">
        <img id="current-slide-img" class="slide-img" src="/assets/slides/insta/page_1.png" alt="Improving the Reels Experience on Instagram Slide 1" loading="eager">
      </div>

      <div class="slides-controls">
        <button id="btn-prev-slide" class="nav-arrow-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Previous</span>
        </button>
        
        <span id="slide-counter" class="slide-counter">Slide 1 of 11</span>
        
        <button id="btn-next-slide" class="nav-arrow-btn">
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- Floating Download CTA -->
  <a href="/Insta product teardown by Lakshay.pdf" target="_blank" rel="noopener noreferrer" class="floating-download-pill">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e1306c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="12" y1="18" x2="12" y2="12"></line>
      <line x1="9" y1="15" x2="15" y2="15"></line>
    </svg>
    <span>Open Original PDF Presentation</span>
  </a>

  <script>
    (function() {
      const slides = ["/assets/slides/insta/page_1.png", "/assets/slides/insta/page_2.png", "/assets/slides/insta/page_3.png", "/assets/slides/insta/page_4.png", "/assets/slides/insta/page_5.png", "/assets/slides/insta/page_6.png", "/assets/slides/insta/page_7.png", "/assets/slides/insta/page_8.png", "/assets/slides/insta/page_9.png", "/assets/slides/insta/page_10.png", "/assets/slides/insta/page_11.png"];
      let currentSlideIdx = 0;

      // Elements
      const btnPdf = document.getElementById("btn-view-pdf");
      const btnSlides = document.getElementById("btn-view-slides");
      const pdfContainer = document.getElementById("pdf-view-container");
      const slidesContainer = document.getElementById("slides-view-container");
      const currentImg = document.getElementById("current-slide-img");
      const slideCounter = document.getElementById("slide-counter");
      const btnPrev = document.getElementById("btn-prev-slide");
      const btnNext = document.getElementById("btn-next-slide");
      const btnFullscreen = document.getElementById("btn-fullscreen");

      // Switch View
      function switchView(mode) {
        if (mode === "slides") {
          btnSlides.classList.add("active");
          btnPdf.classList.remove("active");
          slidesContainer.classList.remove("hidden");
          pdfContainer.classList.add("hidden");
        } else {
          btnPdf.classList.add("active");
          btnSlides.classList.remove("active");
          pdfContainer.classList.remove("hidden");
          slidesContainer.classList.add("hidden");
        }
      }

      if (btnPdf) btnPdf.addEventListener("click", () => switchView("pdf"));
      if (btnSlides) btnSlides.addEventListener("click", () => switchView("slides"));

      // Slide Navigation
      function updateSlide(idx) {
        if (idx < 0 || idx >= slides.length) return;
        currentSlideIdx = idx;
        if (currentImg) {
          currentImg.src = slides[currentSlideIdx];
          currentImg.alt = "Improving the Reels Experience on Instagram Slide " + (currentSlideIdx + 1);
        }
        if (slideCounter) {
          slideCounter.textContent = "Slide " + (currentSlideIdx + 1) + " of " + slides.length;
        }
        if (btnPrev) btnPrev.disabled = (currentSlideIdx === 0);
        if (btnNext) btnNext.disabled = (currentSlideIdx === slides.length - 1);
      }

      if (btnPrev) btnPrev.addEventListener("click", () => updateSlide(currentSlideIdx - 1));
      if (btnNext) btnNext.addEventListener("click", () => updateSlide(currentSlideIdx + 1));

      // Keyboard arrow shortcuts
      window.addEventListener("keydown", (e) => {
        if (slidesContainer && !slidesContainer.classList.contains("hidden")) {
          if (e.key === "ArrowRight" || e.key === " ") {
            updateSlide(currentSlideIdx + 1);
          } else if (e.key === "ArrowLeft") {
            updateSlide(currentSlideIdx - 1);
          }
        }
      });

      // Fullscreen Toggle
      if (btnFullscreen) {
        btnFullscreen.addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
          }
        });
      }
    })();
  </script>
</body>
</html>
